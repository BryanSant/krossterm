name: Publish to Maven
on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode GPG Key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | base64 --decode > gpg_key.asc
          echo "GPG_KEY_CONTENT<<EOF" >> $GITHUB_ENV
          cat gpg_key.asc >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          rm gpg_key.asc

      - name: Compute versions
        id: versions
        run: |
          CURRENT=$(grep '^version=' gradle.properties | cut -d= -f2)
          RELEASE="${CURRENT%-SNAPSHOT}"
          if [[ ! "$RELEASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: invalid version '$CURRENT' in gradle.properties" >&2
            exit 1
          fi
          TAG="${{ github.ref_name }}"
          TAG_VERSION="${TAG#v}"
          if [[ "$TAG_VERSION" != "$RELEASE" ]]; then
            echo "Error: tag '$TAG' does not match release version '$RELEASE' (from gradle.properties version '$CURRENT')" >&2
            exit 1
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$RELEASE"
          NEXT="$MAJOR.$MINOR.$((PATCH + 1))-SNAPSHOT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Publish to Maven Central and GitHub Packages
        run: ./gradlew publishAggregationToCentralPortal -Pversion=${{ steps.versions.outputs.release }}
        env:
          MVN_CENTRAL_USER: ${{ secrets.MVN_CENTRAL_USER }}
          MVN_CENTRAL_PASS: ${{ secrets.MVN_CENTRAL_PASS }}
          GPG_PRIVATE_KEY: ${{ env.GPG_KEY_CONTENT }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump to next snapshot
        run: |
          NEW_VERSION="${{ steps.versions.outputs.next }}"
          sed -i "s/^version=.*/version=$NEW_VERSION/" gradle.properties
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gradle.properties
          git commit -m "chore: bump version to $NEW_VERSION"
          git push origin HEAD:main
