name: Publish to Maven Central

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode GPG Key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | base64 --decode > gpg_key.asc
          echo "GPG_KEY_CONTENT<<EOF" >> $GITHUB_ENV
          cat gpg_key.asc >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          rm gpg_key.asc

      - name: Publish to Maven Central
        run: ./gradlew --no-daemon publishAllPublicationsToCentralPortal
        env:
          GPG_PRIVATE_KEY: ${{ env.GPG_KEY_CONTENT }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
