name: Publish to Maven
on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode GPG Key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | base64 --decode > gpg_key.asc
          echo "GPG_KEY_CONTENT<<EOF" >> $GITHUB_ENV
          cat gpg_key.asc >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          rm gpg_key.asc

      - name: Publish to Maven Central and GitHub Packages
        run: ./gradlew publishAllPublicationsToCentralPortal
        env:
          MVN_CENTRAL_USER: ${{ secrets.MVN_CENTRAL_USER }}
          MVN_CENTRAL_PASS: ${{ secrets.MVN_CENTRAL_PASS }}
          GPG_PRIVATE_KEY: ${{ env.GPG_KEY_CONTENT }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump patch version
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          else
            CURRENT=$(grep '^version=' gradle.properties | cut -d= -f2)
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          fi
          NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          sed -i "s/^version=.*/version=$NEW_VERSION/" gradle.properties
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gradle.properties
          git commit -m "chore: bump version to $NEW_VERSION"
          git push
