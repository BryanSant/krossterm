name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }} / JDK ${{ matrix.jdk }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        jdk: [21, 25]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.jdk }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build & test (default — TTY tests excluded)
        run: ./gradlew --no-daemon test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.os }}-jdk${{ matrix.jdk }}
          path: build/reports/tests/test
          if-no-files-found: ignore
          retention-days: 7

  build-jar:
    name: Build JAR
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon jar sourcesJar javadocJar
      - uses: actions/upload-artifact@v4
        with:
          name: krossterm-jars
          path: build/libs/*.jar
          retention-days: 30
